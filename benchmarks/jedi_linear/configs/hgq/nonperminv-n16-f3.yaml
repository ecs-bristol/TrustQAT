# Converted from TrustQAT-AE configs/sweep-n16-f3.yaml
seed: 42
save_path: runs/jedi_linear/hgq/nonperminv-n16-f3
data:
  path: ${oc.env:TRUSTQAT_JEDI_DATA,dataset}
  n_constituents: 16
  pt_eta_phi: true
  val_split: 0.1
  input_dtype: float16
model:
  name: jedi_linear
  model_class: gnn
  init_bw_a: 7
  init_bw_k: 7
  k_bw_l1_reg: 1.0e-08
  a_bw_l1_reg: 1.0e-08
backend:
  name: hgq2
  beta:
    intervals:
      - [0, 2.0e-08, linear]
      - [2000, 3.0e-07, log]
      - ["${train.epochs}", 3.0e-06, constant]
train:
  batch_size: 2790
  epochs: 7000
  optimizer: {name: adam}
  lr_schedule:
    name: cosine_restarts
    initial_learning_rate: 3.0e-03
    first_decay_steps: 100
    t_mul: 1.0
    m_mul: 1.0
    alpha: 1.0e-06
    alpha_steps: 10
  freeze_precision: false
trust:
  objectives: []
selection:
  objectives: {val_accuracy: max, cost.ebops: min}
  constraints: {val_accuracy: {gt: 0.5}}
eval:
  n_bins: 15
  batch_size: 16384
export:
  target: da4ml
  prj_name: jet_classifier_large
  part_name: xcvu13p-flga2577-2-e
  clock_period: 2.0
  latency_cutoff: 2
