# TrustQAT fine-tuning of the 530-EBOP HGQ checkpoint (TrustQAT-AE hgq-ae/scripts/run_jsc_trust_*.sh)
seed: 42
seed_keras: true
save_path: runs/jsc_hlf/trustqat/ebops530
data:
  path: ${oc.env:TRUSTQAT_JSC_DATA,dataset/jsc_hlf_openml_splits.npz}
model:
  name: jsc_hlf
  checkpoint: "${oc.env:TRUSTQAT_JSC_MODELS,models/jsc_openml}/epoch=199491-val_acc=0.733-ebops=530-val_loss=0.831.keras"
backend:
  name: hgq2
  beta:
    intervals:
      - [0, 0.0, constant]
      - ["${train.epochs}", 0.0, constant]
train:
  batch_size: 33200
  epochs: 100
  drop_last: false
  optimizer: {name: adam}
  lr_schedule:
    name: cosine_restarts
    initial_learning_rate: 3.0e-05
    first_decay_steps: ${train.epochs}
    t_mul: 1.0
    m_mul: 1.0
    alpha: 1.0e-06
    alpha_steps: 10
  early_stopping:
    enabled: true
    monitor: val_loss
    mode: min
    patience: 15
    min_delta: 1.0e-04
    restore_best_weights: false
  freeze_precision: false
trust:
  objectives:
    - {name: soft_ece, weight: 2.0, n_bins: 15}
selection:
  objectives: {val_accuracy: max, cost.ebops: min, val_ece: min}
  accuracy_tolerance: 0.005  # val_accuracy >= (HGQ checkpoint val_accuracy) - 0.005
  final: {min: val_ece}
eval:
  n_bins: 15
  batch_size: 33200
  calibrate: true            # trace_minmax on train+val, as for the hardware
  report_uncalibrated: true  # also report the model as trained (TrustQAT-AE Table I numbers)
export:
  target: da4ml
  prj_name: jsc
  part_name: xcvu13p-flga2577-2-e
  clock_period: 1.0
  latency_cutoff: 1
  vivado_tcl_replace:
    - [" -directive AreaOptimized_High", ""]
