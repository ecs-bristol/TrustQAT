# conda env create -f environment.yml && conda activate trustqat
# Tested on Linux x86_64 with NVIDIA RTX 3090 (driver 610, CUDA 13.3 runtime available).
name: trustqat
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - git
  - verilator  # da4ml RTL emulation
  - pip:
      - "jax[cuda12]==0.12.0.1"
      - "keras==3.15.1"
      - "HGQ2==0.2.0"
      - "da4ml==0.6.0"
      - "h5py"
      - "numpy"
      - "omegaconf"
      - "pyyaml"
      - "tqdm"
      - "matplotlib"
      - "pytest"
      - "ruff"
      - "-e .[hgq2,da4ml,jedi,dev]"
variables:
  KERAS_BACKEND: jax
